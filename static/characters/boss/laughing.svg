<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Glow -->
  <radialGradient id="bossLaughAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="120" r="110" fill="url(#bossLaughAura)"/>

  <!-- Suit / Body -->
  <path d="M40 230 C50 170, 70 160, 120 160 C170 160, 190 170, 200 230 Z" fill="#1e293b"/>
  <polygon points="120,165 95,190 120,215 145,190" fill="#f8fafc"/>
  <polygon points="116,190 124,190 127,240 113,240" fill="#dc2626"/>

  <!-- Neck -->
  <rect x="104" y="140" width="32" height="30" fill="#e0a97a"/>

  <!-- Head tilted slightly back -->
  <ellipse cx="120" cy="102" rx="52" ry="58" fill="#f3be94"/>

  <!-- Hair -->
  <path d="M68 92 C68 49, 90 38, 120 38 C150 38, 172 49, 172 92 C172 97, 168 77, 150 65 C135 60, 105 60, 90 65 C72 77, 68 97, 68 92 Z" fill="#1e293b"/>
  <ellipse cx="68" cy="107" rx="8" ry="14" fill="#e0a97a"/>
  <ellipse cx="172" cy="107" rx="8" ry="14" fill="#e0a97a"/>

  <!-- Mocking Arched Brows -->
  <path d="M82 80 Q98 75 110 86" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <path d="M158 80 Q142 75 130 86" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

  <!-- Glasses Frame -->
  <rect x="80" y="88" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <rect x="126" y="88" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <line x1="114" y1="97" x2="126" y2="97" stroke="#334155" stroke-width="3.5"/>

  <!-- Squinting Laughing Eyes (Crescents) -->
  <path d="M88 100 Q97 93 106 100" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M134 100 Q143 93 152 100" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Laugh tear -->
  <ellipse cx="78" cy="104" rx="3" ry="5" fill="#38bdf8"/>

  <!-- Nose -->
  <path d="M120 98 L115 116 L125 116" fill="none" stroke="#c88a58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mustache lifted in laugh -->
  <path d="M96 122 C108 116, 118 122, 120 124 C122 122, 132 116, 144 122 C146 130, 134 132, 120 129 C106 132, 94 130, 96 122 Z" fill="#0f172a"/>

  <!-- Broad Mocking Grin / Laughter Mouth -->
  <path d="M92 130 Q120 134 148 130 Q144 162 120 162 Q96 162 92 130 Z" fill="#6b1414" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Top Teeth -->
  <path d="M98 131 L142 131" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="120" cy="154" rx="14" ry="7" fill="#ef4444"/>
</svg>
