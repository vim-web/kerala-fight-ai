<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Aura -->
  <radialGradient id="bossAngAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff4444" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="120" r="110" fill="url(#bossAngAura)"/>
  
  <!-- Suit / Body -->
  <path d="M40 230 C50 170, 70 160, 120 160 C170 160, 190 170, 200 230 Z" fill="#1e293b"/>
  <!-- Shirt Collar -->
  <polygon points="120,165 95,190 120,215 145,190" fill="#f8fafc"/>
  <!-- Red Tie -->
  <polygon points="116,190 124,190 127,240 113,240" fill="#dc2626"/>
  <polygon points="113,185 127,185 124,195 116,195" fill="#991b1b"/>

  <!-- Neck -->
  <rect x="104" y="140" width="32" height="30" fill="#e0a97a"/>

  <!-- Head -->
  <ellipse cx="120" cy="105" rx="52" ry="58" fill="#f3be94"/>
  <!-- Red Flush / Anger glow -->
  <ellipse cx="120" cy="115" rx="42" ry="25" fill="#ef4444" opacity="0.22"/>

  <!-- Receding Hair -->
  <path d="M68 95 C68 52, 90 40, 120 40 C150 40, 172 52, 172 95 C172 100, 168 80, 150 68 C135 62, 105 62, 90 68 C72 80, 68 100, 68 95 Z" fill="#1e293b"/>
  <!-- Sideburns & Ears -->
  <ellipse cx="68" cy="110" rx="8" ry="14" fill="#e0a97a"/>
  <ellipse cx="172" cy="110" rx="8" ry="14" fill="#e0a97a"/>

  <!-- Popping Vein on Forehead -->
  <path d="M148 68 Q154 73 150 78 Q156 82 153 87" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M149 78 Q144 80 142 86" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Angry Brows -->
  <path d="M82 86 L112 100" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <path d="M158 86 L128 100" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

  <!-- Glasses Frame -->
  <rect x="80" y="93" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <rect x="126" y="93" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <line x1="114" y1="102" x2="126" y2="102" stroke="#334155" stroke-width="3.5"/>

  <!-- Eyes - Glaring -->
  <ellipse cx="97" cy="105" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="98" cy="105" r="3.5" fill="#0f172a"/>
  <circle cx="96" cy="103" r="1.2" fill="#ffffff"/>
  <ellipse cx="143" cy="105" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="142" cy="105" r="3.5" fill="#0f172a"/>
  <circle cx="140" cy="103" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M120 102 L115 122 L125 122" fill="none" stroke="#c88a58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thick Kerala Mustache -->
  <path d="M96 130 C108 126, 118 132, 120 134 C122 132, 132 126, 144 130 C146 138, 134 140, 120 137 C106 140, 94 138, 96 130 Z" fill="#0f172a"/>

  <!-- Roaring Open Mouth -->
  <path d="M98 142 Q120 138 142 142 Q136 164 120 164 Q104 164 98 142 Z" fill="#581c1c" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Clenched Sharp Teeth -->
  <path d="M102 142 L138 142" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="120" cy="158" rx="12" ry="6" fill="#dc2626"/>
</svg>
