<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Glow -->
  <radialGradient id="bossSpeakAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="120" r="110" fill="url(#bossSpeakAura)"/>

  <!-- Suit / Body -->
  <path d="M40 230 C50 170, 70 160, 120 160 C170 160, 190 170, 200 230 Z" fill="#1e293b"/>
  <!-- Pointing Finger / Hand silhouette -->
  <path d="M170 195 C185 180, 205 170, 215 160 C218 157, 222 162, 218 166 C208 178, 195 190, 185 208 Z" fill="#e0a97a"/>

  <!-- Collar & Tie -->
  <polygon points="120,165 95,190 120,215 145,190" fill="#f8fafc"/>
  <polygon points="116,190 124,190 127,240 113,240" fill="#dc2626"/>

  <!-- Neck -->
  <rect x="104" y="140" width="32" height="30" fill="#e0a97a"/>

  <!-- Head -->
  <ellipse cx="120" cy="105" rx="52" ry="58" fill="#f3be94"/>

  <!-- Hair -->
  <path d="M68 95 C68 52, 90 40, 120 40 C150 40, 172 52, 172 95 C172 100, 168 80, 150 68 C135 62, 105 62, 90 68 C72 80, 68 100, 68 95 Z" fill="#1e293b"/>
  <ellipse cx="68" cy="110" rx="8" ry="14" fill="#e0a97a"/>
  <ellipse cx="172" cy="110" rx="8" ry="14" fill="#e0a97a"/>

  <!-- Expressive Eyebrows: One raised, one furrowed -->
  <path d="M82 86 L110 94" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <path d="M156 78 Q142 74 130 84" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

  <!-- Glasses -->
  <rect x="80" y="91" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <rect x="126" y="91" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <line x1="114" y1="100" x2="126" y2="100" stroke="#334155" stroke-width="3.5"/>

  <!-- Eyes Focused Forward -->
  <ellipse cx="97" cy="103" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="98" cy="103" r="3.5" fill="#0f172a"/>
  <ellipse cx="143" cy="103" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="142" cy="103" r="3.5" fill="#0f172a"/>

  <!-- Nose -->
  <path d="M120 100 L115 120 L125 120" fill="none" stroke="#c88a58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mustache -->
  <path d="M96 126 C108 122, 118 126, 120 128 C122 126, 132 122, 144 126 C146 134, 134 136, 120 133 C106 136, 94 134, 96 126 Z" fill="#0f172a"/>

  <!-- Open Talking Mouth -->
  <ellipse cx="120" cy="147" rx="15" ry="12" fill="#581c1c" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M108 143 L132 143" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="120" cy="154" rx="10" ry="5" fill="#ef4444"/>

  <!-- Speech Waves -->
  <path d="M148 142 Q156 146 148 150" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M154 138 Q166 146 154 154" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
</svg>
