    <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="120" r="110" fill="url(#bossSulkAura)"/>

  <!-- Slouched Suit / Crossed Arms Silhouette -->
  <path d="M35 230 C45 175, 70 165, 120 165 C170 165, 195 175, 205 230 Z" fill="#1e293b"/>
  <path d="M60 215 C85 200, 155 200, 180 215 C170 235, 70 235, 60 215 Z" fill="#0f172a"/>
