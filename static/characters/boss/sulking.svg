  <!-- Hair -->
  <path d="M64 96 C64 53, 86 41, 116 41 C146 41, 168 53, 168 96 C168 101, 164 81, 146 69 C131 63, 101 63, 86 69 C68 81, 64 101, 64 96 Z" fill="#1e293b"/>
