  <rect x="76" y="94" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <rect x="122" y="94" width="34" height="24" rx="5" fill="none" stroke="#334155" stroke-width="3.5"/>
  <line x1="110" y1="104" x2="122" y2="104" stroke="#334155" stroke-width="3.5"/>

  <!-- Side-Eye / Sulking Gaze -->
  <ellipse cx="93" cy="106" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="89" cy="106" r="3.5" fill="#0f172a"/>
  <ellipse cx="139" cy="106" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="135" cy="106" r="3.5" fill="#0f172a"/>

