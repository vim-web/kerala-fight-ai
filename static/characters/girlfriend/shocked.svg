  <path d="M55 95 C55 45, 80 32, 120 32 C160 32, 185 45, 185 95 C180 65, 155 55, 120 58 C85 55, 60 65, 55 95 Z" fill="#18181b"/>
  <path d="M55 95 C62 135, 75 160, 80 180 C74 150, 66 120, 60 95 Z" fill="#18181b"/>
  <path d="M185 95 C178 135, 165 160, 160 180 C166 150, 174 120, 180 95 Z" fill="#18181b"/>

  <!-- Earrings -->
  <circle cx="71" cy="132" r="3" fill="#facc15"/>
  <path d="M66 136 Q71 144 76 136 Z" fill="#eab308"/>
  <circle cx="169" cy="132" r="3" fill="#facc15"/>
  <path d="M164 136 Q169 144 174 136 Z" fill="#eab308"/>

  <!-- Bindi -->
