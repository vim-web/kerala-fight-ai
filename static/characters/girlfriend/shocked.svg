  <!-- High Arched Shocked Brows -->
  <path d="M86 78 Q98 68 112 80" fill="none" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>
  <path d="M154 78 Q142 68 128 80" fill="none" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>

  <!-- Wide Popping Eyeliner Eyes -->
  <ellipse cx="98" cy="98" rx="9" ry="10" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
  <circle cx="98" cy="98" r="3.5" fill="#27272a"/>
  <circle cx="96" cy="96" r="1.2" fill="#ffffff"/>

  <ellipse cx="142" cy="98" rx="9" ry="10" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
  <circle cx="142" cy="98" r="3.5" fill="#27272a"/>
  <circle cx="140" cy="96" r="1.2" fill="#ffffff"/>

  <!-- Sweat drop -->
