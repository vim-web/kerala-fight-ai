  <!-- Dainty Nose -->
  <path d="M120 102 L117 118 L123 118" fill="none" stroke="#c88a58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gasping 'O' Mouth -->
  <ellipse cx="120" cy="142" rx="10" ry="13" fill="#881337" stroke="#4c0519" stroke-width="2"/>
