<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Glow -->
  <radialGradient id="gfLaughAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="120" r="110" fill="url(#gfLaughAura)"/>

  <!-- Back Hair -->
  <path d="M50 100 C40 160, 45 220, 60 240 L180 240 C195 220, 200 160, 190 100 C185 50, 55 50, 50 100 Z" fill="#09090b"/>

  <!-- Body / Kurti with Gold border -->
  <path d="M55 240 C65 180, 85 165, 120 165 C155 165, 175 180, 185 240 Z" fill="#e11d48"/>
  <path d="M100 165 C110 185, 130 185, 140 165 Z" fill="#facc15"/>

  <!-- Neck -->
  <rect x="108" y="135" width="24" height="35" fill="#e6a479"/>

  <!-- Head tilted back slightly -->
  <ellipse cx="120" cy="105" rx="46" ry="52" fill="#f6be96"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="85" cy="118" rx="14" ry="7" fill="#fb7185" opacity="0.35"/>
  <ellipse cx="155" cy="118" rx="14" ry="7" fill="#fb7185" opacity="0.35"/>

  <!-- Front Hair -->
  <path d="M55 92 C55 42, 80 30, 120 30 C160 30, 185 42, 185 92 C180 62, 155 52, 120 55 C85 52, 60 62, 55 92 Z" fill="#18181b"/>
  <path d="M55 92 C62 132, 75 158, 80 178 C74 148, 66 118, 60 92 Z" fill="#18181b"/>
  <path d="M185 92 C178 132, 165 158, 160 178 C166 148, 174 118, 180 92 Z" fill="#18181b"/>

  <!-- Earrings -->
  <circle cx="71" cy="128" r="3" fill="#facc15"/>
  <path d="M66 132 Q71 140 76 132 Z" fill="#eab308"/>
  <circle cx="169" cy="128" r="3" fill="#facc15"/>
  <path d="M164 132 Q169 140 174 132 Z" fill="#eab308"/>

  <!-- Bindi -->
  <circle cx="120" cy="82" r="2.5" fill="#dc2626"/>

  <!-- Arched Sarcastic Eyebrows -->
  <path d="M86 82 Q98 74 112 85" fill="none" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>
  <path d="M154 82 Q142 74 128 85" fill="none" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>

  <!-- Rolling / Laughing Eyes (Crescents) -->
  <path d="M86 98 Q98 90 110 98" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M154 98 Q142 90 130 98" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Laugh tear of mockery -->
  <ellipse cx="80" cy="103" rx="2.5" ry="4" fill="#38bdf8"/>

  <!-- Dainty Nose -->
  <path d="M120 98 L117 114 L123 114" fill="none" stroke="#c88a58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sarcastic Laughing Mouth / Grin -->
  <path d="M98 124 Q120 128 142 124 Q136 148 120 148 Q104 148 98 124 Z" fill="#881337" stroke="#4c0519" stroke-width="2"/>
  <path d="M102 126 L138 126" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="120" cy="142" rx="9" ry="4" fill="#f43f5e"/>
</svg>
