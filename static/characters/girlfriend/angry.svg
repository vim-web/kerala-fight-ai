<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Glow -->
  <radialGradient id="gfAngAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="120" r="110" fill="url(#gfAngAura)"/>

  <!-- Back Hair (Long flows) -->
  <path d="M50 100 C40 160, 45 220, 60 240 L180 240 C195 220, 200 160, 190 100 C185 50, 55 50, 50 100 Z" fill="#09090b"/>

  <!-- Body / Kurti with Gold border -->
